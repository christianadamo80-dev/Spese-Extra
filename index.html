<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Spese Figli</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen pb-12">

    <div class="max-w-6xl mx-auto px-4 pt-6">
        <header class="flex flex-col sm:flex-row justify-between items-center mb-6 bg-white p-4 rounded-xl shadow-sm gap-4">
            <h1 class="text-xl font-bold text-gray-900">📊 Spese Straordinarie Figli</h1>
            <div class="flex flex-wrap gap-2">
                <button onclick="esportaDati()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-medium transition">Esporta Backup JSON</button>
                <button onclick="document.getElementById('importFile').click()" class="text-xs bg-gray-100 hover:bg-gray-200 px-3 py-1.5 rounded-lg font-medium transition">Importa JSON</button>
                <input type="file" id="importFile" class="hidden" accept=".json" onchange="importaDati(event)">
            </div>
        </header>

        <div class="bg-gradient-to-r divide-x divide-gray-200 bg-white p-5 rounded-xl shadow-sm mb-6 grid grid-cols-1 md:grid-cols-2 gap-4 border border-blue-100">
            <div>
                <h3 class="text-sm font-bold text-gray-900 mb-1">📥 Importa da File Excel (.xlsx) o CSV</h3>
                <p class="text-xs text-gray-500 mb-3">Carica un file per estrarre le spese in blocco.</p>
                <input type="file" id="excelFile" accept=".xlsx, .xls, .csv" onchange="elaboraExcel(event)" class="block w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer">
            </div>
            <div id="configurazioneExcel" class="hidden pl-0 md:pl-4 flex flex-col justify-between">
                <div class="grid grid-cols-2 gap-2 text-xs">
                    <div><label class="block font-medium text-gray-600 mb-1">Colonna Figlio</label><select id="colFiglio" class="w-full bg-gray-50 border p-1 rounded"></select></div>
                    <div><label class="block font-medium text-gray-600 mb-1">Colonna Spesa (€)</label><select id="colImporto" class="w-full bg-gray-50 border p-1 rounded"></select></div>
                    <div><label class="block font-medium text-gray-600 mb-1">Colonna Descrizione</label><select id="colDesc" class="w-full bg-gray-50 border p-1 rounded"></select></div>
                    <div><label class="block font-medium text-gray-600 mb-1">Colonna Data</label><select id="colData" class="w-full bg-gray-50 border p-1 rounded"></select></div>
                </div>
                <button onclick="confermaImportazioneExcel()" class="w-full mt-3 bg-green-600 hover:bg-green-700 text-white font-medium py-1 px-3 rounded text-xs transition">Conferma e Importa Righe</button>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-white p-4 rounded-xl shadow-sm flex flex-col justify-center">
                <label class="text-xs font-bold uppercase text-gray-400 mb-1">Anno di Riferimento</label>
                <select id="filtroAnno" onchange="aggiornaInterfaccia()" class="w-full bg-gray-50 border border-gray-200 rounded-lg p-2 font-semibold text-lg focus:outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-blue-500">
                <div class="text-xs font-bold uppercase text-gray-400">Totale Speso Annuale (escluse ≤ 10€)</div>
                <div id="totaleSpeso" class="text-2xl font-black text-gray-900 mt-1">0,00 €</div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border-l-4 border-green-500">
                <div class="text-xs font-bold uppercase text-gray-400">Quota Rimborso Singolo (50%)</div>
                <div id="quotaRimborso" class="text-2xl font-black text-green-600 mt-1">0,00 €</div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="bg-white p-5 rounded-xl shadow-sm h-fit">
                <h2 class="text-md font-bold mb-4 text-gray-900">Aggiungi Singola Spesa</h2>
                <form id="spesaForm" onsubmit="aggiungiSpesa(event)" class="space-y-4">
                    <div><label class="block text-xs font-semibold text-gray-600 mb-1">Data</label><input type="date" id="data" required class="w-full p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-semibold text-gray-600 mb-1">Figlio/a</label><input type="text" id="figlio" required class="w-full p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-semibold text-gray-600 mb-1">Descrizione</label><input type="text" id="descrizione" required class="w-full p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                    <div><label class="block text-xs font-semibold text-gray-600 mb-1">Importo (€)</label><input type="number" step="0.01" id="importo" required class="w-full p-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none"></div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium p-2.5 rounded-lg transition mt-2">Salva Spesa</button>
                </form>
            </div>

            <div class="lg:grid-cols-3 lg:col-span-2 bg-white p-5 rounded-xl shadow-sm">
                <h2 class="text-md font-bold mb-4 text-gray-900">Registro Spese</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                        <thead><tr class="border-b border-gray-100 text-xs font-bold uppercase text-gray-400"><th class="py-3 px-2">Data</th><th class="py-3 px-2">Figlio</th><th class="py-3 px-2">Descrizione</th><th class="py-3 px-2 text-right">Importo</th><th class="py-3 px-2 text-center">Azione</th></tr></thead>
                        <tbody id="listaSpese" class="divide-y divide-gray-50 text-sm"></tbody>
                    </table>
                </div>
                <div id="nessunaSpesa" class="text-center py-8 text-gray-400 text-sm hidden">Nessuna spesa registrata.</div>
            </div>
        </div>
    </div>

    <script>
        let spese = JSON.parse(localStorage.getItem('spese_extra_figli')) || [];
        let datiExcelTemporanei = null;

        window.onload = function() {
            document.getElementById('data').valueAsDate = new Date();
            inizializzaFiltroAnni();
            aggiornaInterfaccia();
        };

        function inizializzaFiltroAnni() {
            const select = document.getElementById('filtroAnno');
            const anni = new Set([new Date().getFullYear()]);
            spese.forEach(s => { if(s.data) anni.add(new Date(s.data).getFullYear()); });
            const v = select.value;
            select.innerHTML = '';
            Array.from(anni).sort((a, b) => b - a).forEach(a => { const opt = document.createElement('option'); opt.value = a; opt.textContent = a; select.appendChild(opt); });
            if([...anni].includes(parseInt(v))) select.value = v;
        }

        function aggiungiSpesa(e) {
            e.preventDefault();
            spese.push({
                id: Date.now() + Math.random(),
                data: document.getElementById('data').value,
                figlio: document.getElementById('figlio').value.trim(),
                descrizione: document.getElementById('descrizione').value.trim(),
                importo: parseFloat(document.getElementById('importo').value)
            });
            salvaDati();
            document.getElementById('descrizione').value = '';
            document.getElementById('importo').value = '';
            inizializzaFiltroAnni();
            aggiornaInterfaccia();
        }

        function elaboraExcel(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                let wb = file.name.toLowerCase().endsWith('.csv') ? 
                         XLSX.read(evt.target.result, { type: 'string', codepage: 65001 }) : 
                         XLSX.read(new Uint8Array(evt.target.result), { type: 'array', cellDates: true });
                datiExcelTemporanei = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: "" });
                popolaSelettoriColonne(Object.keys(datiExcelTemporanei[0]));
                document.getElementById('configurazioneExcel').classList.remove('hidden');
            };
            file.name.toLowerCase().endsWith('.csv') ? reader.readAsText(file) : reader.readAsArrayBuffer(file);
        }

        function popolaSelettoriColonne(cols) {
            ['colFiglio', 'colImporto', 'colDesc', 'colData'].forEach(id => {
                const sel = document.getElementById(id);
                sel.innerHTML = '<option value="">-- Seleziona --</option>';
                cols.forEach(c => {
                    const opt = document.createElement('option'); opt.value = c; opt.textContent = c;
                    const cL = c.toLowerCase();
                    if((id==='colFiglio'&&(cL.includes('figl')||cL.includes('nome')))||(id==='colImporto'&&(cL.includes('imp')||cL.includes('euro')))||(id==='colDesc'&&(cL.includes('desc')||cL.includes('caus')))||(id==='colData'&&(cL.includes('dat')))) opt.selected=true;
                    sel.appendChild(opt);
                });
            });
        }

        function confermaImportazioneExcel() {
            const cF = document.getElementById('colFiglio').value, cI = document.getElementById('colImporto').value, cD = document.getElementById('colDesc').value, cData = document.getElementById('colData').value;
            datiExcelTemporanei.forEach(r => {
                const imp = parseFloat(String(r[cI]).replace(/[^0-9.,-]/g, '').replace(',', '.'));
                if (r[cF] && !isNaN(imp) && imp > 0) {
                    spese.push({ id: Date.now() + Math.random(), data: cData && r[cData] ? new Date(r[cData]).toISOString().split('T')[0] : new Date().toISOString().split('T')[0], figlio: r[cF], descrizione: r[cD], importo: imp });
                }
            });
            salvaDati();
            inizializzaFiltroAnni();
            aggiornaInterfaccia();
            document.getElementById('configurazioneExcel').classList.add('hidden');
        }

        function aggiornaInterfaccia() {
            const anno = parseInt(document.getElementById('filtroAnno').value) || new Date().getFullYear();
            const list = document.getElementById('listaSpese');
            const filtered = spese.filter(s => s.data && new Date(s.data).getFullYear() === anno).sort((a,b) => new Date(b.data)-new Date(a.data));
            list.innerHTML = '';
            let total = 0;
            filtered.forEach(s => {
                if (s.importo > 10) total += s.importo;
                list.innerHTML += `<tr class="hover:bg-gray-50">
                    <td class="py-3 px-2">${new Date(s.data).toLocaleDateString()}</td>
                    <td class="py-3 px-2">${scappaHTML(s.figlio)}</td>
                    <td class="py-3 px-2">${scappaHTML(s.descrizione)}</td>
                    <td class="py-3 px-2 text-right font-semibold">${s.importo.toLocaleString('it-IT',{style:'currency',currency:'EUR'})} ${s.importo <= 10 ? '<span class="text-[10px] text-gray-400">(Esclusa)</span>' : ''}</td>
                    <td class="py-3 px-2 text-center"><button onclick="eliminaSpesa(${s.id})" class="text-red-500">Elimina</button></td>
                </tr>`;
            });
            document.getElementById('totaleSpeso').textContent = total.toLocaleString('it-IT',{style:'currency',currency:'EUR'});
            document.getElementById('quotaRimborso').textContent = (total / 2).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
            document.getElementById('nessunaSpesa').classList.toggle('hidden', filtered.length > 0);
        }

        function eliminaSpesa(id) { spese = spese.filter(s => s.id !== id); salvaDati(); aggiornaInterfaccia(); }
        function salvaDati() { localStorage.setItem('spese_extra_figli', JSON.stringify(spese)); }
        function esportaDati() { const d = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(spese)); const a = document.createElement('a'); a.href = d; a.download = "backup.json"; a.click(); }
        function importaDati(e) { const r = new FileReader(); r.onload = (evt) => { spese = JSON.parse(evt.target.result); salvaDati(); aggiornaInterfaccia(); }; r.readAsText(e.target.files[0]); }
        function scappaHTML(str) { return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])); }
    </script>
</body>
</html>
